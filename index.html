<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ブレインマップ</title>
<style>
:root {
  --bg:      #1a1a2e;
  --panel:   #16213e;
  --deep:    #0f3460;
  --accent:  #e2b96f;
  --text:    #eee;
  --muted:   #889;
  --danger:  #e2536f;
}

* , *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; overscroll-behavior: none; }

body {
  font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  inset: 0;
}

/* ===================== HEADER ===================== */
header {
  flex: none;
  width: 100%;
  background: var(--panel);
  border-bottom: 1px solid var(--deep);
  padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 20;
}

header h1 {
  font-size: 1.05rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--accent);
  white-space: nowrap;
}

.hbtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.ibtn {
  background: var(--deep);
  color: var(--text);
  border: none;
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  white-space: nowrap;
}
.ibtn:active { background: #1b4680; transform: scale(0.96); }
.ibtn.warn { color: var(--danger); }

/* ===================== CANVAS ===================== */
#canvas-wrap {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1.5px, transparent 1.5px) 0 0/28px 28px,
    var(--bg);
  touch-action: none;
}

#world {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

#lines {
  position: absolute;
  top: 0; left: 0;
  overflow: visible;
  pointer-events: none;
}

#nodes-layer {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}

/* ===================== NODE ===================== */
.node {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  width: max-content;
  max-width: 220px;
  min-width: 44px;
  padding: 9px 16px;
  border-radius: 20px;
  background: var(--nc, var(--deep));
  color: #14141f;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  border: 2px solid rgba(255,255,255,0.18);
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.node.root {
  border-radius: 16px;
  font-size: 16px;
  padding: 14px 22px;
  background: var(--accent);
  border-color: #fff3;
  box-shadow: 0 4px 16px rgba(226,185,111,0.35);
}
.node.selected {
  box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(0,0,0,0.4);
}
.node.dragging { cursor: grabbing; opacity: 0.92; }

.node-text {
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  display: block;
}
.node-text[contenteditable="true"] {
  cursor: text;
  background: rgba(255,255,255,0.35);
  border-radius: 8px;
  padding: 2px 4px;
}

.toggle-btn {
  position: absolute;
  right: -9px;
  bottom: -9px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--panel);
  border: 1.5px solid rgba(255,255,255,0.3);
  color: var(--text);
  font-size: 13px;
  font-weight: 900;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
}

/* ===================== SELECTION ACTION BAR ===================== */
#action-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: none;
  gap: 6px;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: var(--panel);
  border-top: 1px solid var(--deep);
  overflow-x: auto;
}
#action-bar.show { display: flex; }
#action-bar .ibtn { flex: 1 1 0; min-width: 70px; }

/* ===================== PALETTE POPOVER ===================== */
#palette-pop {
  position: fixed;
  z-index: 40;
  display: none;
  background: var(--panel);
  border: 1.5px solid var(--deep);
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
}
#palette-pop.show { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch {
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.25);
  touch-action: manipulation;
}
.swatch:active { transform: scale(0.9); }

/* ===================== ZOOM CONTROLS ===================== */
#zoom-ctrl {
  position: fixed;
  right: 12px;
  bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 15;
  transition: bottom 0.15s;
}
body.has-selection #zoom-ctrl,
body.has-selection #hint {
  bottom: calc(72px + env(safe-area-inset-bottom));
}
#zoom-ctrl .ibtn {
  width: 40px; height: 40px;
  padding: 0;
  font-size: 1.1rem;
  border-radius: 12px;
  opacity: 0.9;
}

/* ===================== HINT ===================== */
#hint {
  position: fixed;
  left: 12px;
  bottom: 12px;
  max-width: 60%;
  font-size: 0.68rem;
  color: var(--muted);
  line-height: 1.5;
  z-index: 15;
  pointer-events: none;
  transition: bottom 0.15s;
}

/* ===================== FILE INPUT (hidden) ===================== */
#import-input { display: none; }

@media (min-width: 700px) {
  header h1 { font-size: 1.3rem; letter-spacing: 4px; }
  .ibtn { font-size: 0.82rem; padding: 9px 13px; }
}
</style>
</head>
<body>

<header>
  <h1>ブレインマップ</h1>
  <div class="hbtns">
    <button class="ibtn" id="btn-add-root">＋ ノード</button>
    <button class="ibtn" id="btn-fit">全体表示</button>
    <button class="ibtn" id="btn-export">書き出し</button>
    <button class="ibtn" id="btn-import">読み込み</button>
    <button class="ibtn warn" id="btn-new">新規</button>
  </div>
</header>

<div id="canvas-wrap">
  <div id="world">
    <svg id="lines" width="1" height="1"></svg>
    <div id="nodes-layer"></div>
  </div>
</div>

<div id="zoom-ctrl">
  <button class="ibtn" id="btn-zoom-in">＋</button>
  <button class="ibtn" id="btn-zoom-out">－</button>
</div>

<div id="hint">タップ：選択　　ドラッグ：移動／背景ドラッグでパン<br>ホイール／ピンチ：拡大縮小　　選択中はダブルタップで編集</div>

<div id="action-bar">
  <button class="ibtn" id="act-edit">✏️ 編集</button>
  <button class="ibtn" id="act-child">➕ 子ノード</button>
  <button class="ibtn" id="act-sibling">↩ 兄弟ノード</button>
  <button class="ibtn" id="act-color">🎨 色</button>
  <button class="ibtn warn" id="act-delete">🗑 削除</button>
</div>

<div id="palette-pop"></div>

<input type="file" id="import-input" accept="application/json">

<script>
(function () {
'use strict';

// ========================================================
//  DATA MODEL
// ========================================================
const STORAGE_KEY = 'brainmap:data';
const ROOT_ID = 1;
const PALETTE = ['#e2b96f','#6fc2e2','#e26f8a','#8ae26f','#c26fe2','#e2a06f','#6fe2b9','#e2e26f','#a06fe2','#6f8ae2'];

let nodes = [];          // {id, parentId, text, x, y, color, collapsed}
let nextId = 1;
let selectedId = null;
let editingId = null;
let zoom = 1;
let pan = { x: 0, y: 0 };

const byId = () => Object.fromEntries(nodes.map(n => [n.id, n]));

function children(parentId) {
  return nodes.filter(n => n.parentId === parentId);
}

function descendants(id) {
  const out = [];
  const stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    for (const c of children(cur)) { out.push(c.id); stack.push(c.id); }
  }
  return out;
}

function isVisible(node, map) {
  let cur = node;
  while (cur.parentId !== null) {
    const parent = map[cur.parentId];
    if (!parent) break;
    if (parent.collapsed) return false;
    cur = parent;
  }
  return true;
}

// ========================================================
//  PERSISTENCE
// ========================================================
let saveTimer = null;
function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ nodes, nextId, zoom, pan }));
  } catch (e) { /* storage unavailable, ignore */ }
}
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 250);
}
window.addEventListener('beforeunload', flushSave);
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});

function loadDefault() {
  nodes = [{ id: ROOT_ID, parentId: null, text: '中心テーマ', x: 0, y: 0, color: null, collapsed: false }];
  nextId = 2;
  zoom = 1;
  pan = { x: 0, y: 0 };
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { loadDefault(); return; }
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.nodes) || !data.nodes.some(n => n.id === ROOT_ID)) { loadDefault(); return; }
    nodes = data.nodes;
    nextId = data.nextId || (Math.max(...nodes.map(n => n.id)) + 1);
    zoom = typeof data.zoom === 'number' ? data.zoom : 1;
    pan = data.pan || { x: 0, y: 0 };
  } catch (e) {
    loadDefault();
  }
}

// ========================================================
//  NODE OPERATIONS
// ========================================================
function addChildNode(parentId, text) {
  const map = byId();
  const parent = map[parentId];
  if (!parent) return null;
  const sibs = children(parentId);
  const idx = sibs.length;

  let angle;
  if (parent.parentId === null) {
    angle = idx * 2.399963; // golden-angle spread around root
  } else {
    const dirIn = Math.atan2(parent.y - (map[parent.parentId] ? map[parent.parentId].y : parent.y),
                              parent.x - (map[parent.parentId] ? map[parent.parentId].x : parent.x - 1));
    const spreadSeq = [0, 0.6, -0.6, 1.2, -1.2, 1.8, -1.8];
    angle = dirIn + spreadSeq[idx % spreadSeq.length] + Math.floor(idx / spreadSeq.length) * 0.3;
  }
  const radius = 170 + Math.floor(idx / 8) * 70;
  const x = parent.x + Math.cos(angle) * radius;
  const y = parent.y + Math.sin(angle) * radius;
  const color = parent.parentId === null ? PALETTE[idx % PALETTE.length] : parent.color;

  const id = nextId++;
  nodes.push({ id, parentId, text: text || '新しいトピック', x, y, color, collapsed: false });
  if (parent.collapsed) parent.collapsed = false;
  return id;
}

function addSiblingNode(id) {
  const node = byId()[id];
  if (!node) return null;
  if (node.parentId === null) return addChildNode(id);
  return addChildNode(node.parentId);
}

function deleteNode(id) {
  if (id === ROOT_ID) return;
  const node = byId()[id];
  if (!node) return;
  const toRemove = new Set([id, ...descendants(id)]);
  const parentId = node.parentId;
  nodes = nodes.filter(n => !toRemove.has(n.id));
  if (selectedId !== null && toRemove.has(selectedId)) selectedId = parentId;
}

function resetMap() {
  loadDefault();
  selectedId = null;
  editingId = null;
}

// ========================================================
//  RENDER
// ========================================================
const nodesLayer = document.getElementById('nodes-layer');
const linesSvg = document.getElementById('lines');
const world = document.getElementById('world');
const actionBar = document.getElementById('action-bar');
const palettePop = document.getElementById('palette-pop');

function applyWorldTransform() {
  world.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
}

function renderLines() {
  const map = byId();
  let d = '';
  for (const n of nodes) {
    if (n.parentId === null) continue;
    const p = map[n.parentId];
    if (!p) continue;
    if (!isVisible(n, map)) continue;
    d += `<path d="M ${p.x} ${p.y} L ${n.x} ${n.y}" stroke="${n.color || '#5a6a8a'}" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>`;
  }
  linesSvg.innerHTML = d;
}

function positionNodeEl(el, node) {
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
}

function renderNodeText(el, node) {
  const span = el.querySelector('.node-text');
  if (document.activeElement !== span) span.textContent = node.text;
}

function makeNodeEl(node) {
  const el = document.createElement('div');
  el.className = 'node' + (node.parentId === null ? ' root' : '');
  el.dataset.id = node.id;
  if (node.color) el.style.setProperty('--nc', node.color);
  positionNodeEl(el, node);

  const span = document.createElement('span');
  span.className = 'node-text';
  span.textContent = node.text;
  span.setAttribute('contenteditable', 'false');
  el.appendChild(span);

  el.addEventListener('pointerdown', onNodePointerDown);
  span.addEventListener('blur', () => commitEdit(node.id));
  span.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); span.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); cancelEdit(node.id); span.blur(); }
  });

  return el;
}

function render() {
  const map = byId();
  const existing = new Map();
  nodesLayer.querySelectorAll('.node').forEach(el => existing.set(Number(el.dataset.id), el));

  const seen = new Set();
  for (const node of nodes) {
    seen.add(node.id);
    const visible = isVisible(node, map);
    let el = existing.get(node.id);
    if (!el) {
      el = makeNodeEl(node);
      nodesLayer.appendChild(el);
    }
    el.style.display = visible ? '' : 'none';
    if (!visible) continue;

    positionNodeEl(el, node);
    if (node.color) el.style.setProperty('--nc', node.color);
    renderNodeText(el, node);
    el.classList.toggle('selected', selectedId === node.id);

    // toggle-btn for collapse/expand
    let tbtn = el.querySelector('.toggle-btn');
    const hasKids = children(node.id).length > 0;
    if (hasKids) {
      if (!tbtn) {
        tbtn = document.createElement('button');
        tbtn.className = 'toggle-btn';
        tbtn.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
        });
        tbtn.addEventListener('click', (e) => {
          e.stopPropagation();
          node.collapsed = !node.collapsed;
          save();
          render();
        });
        el.appendChild(tbtn);
      }
      tbtn.textContent = node.collapsed ? '+' : '−';
    } else if (tbtn) {
      tbtn.remove();
    }
  }

  for (const [id, el] of existing) {
    if (!seen.has(id)) el.remove();
  }

  renderLines();
  updateActionBar();
}

function updateActionBar() {
  document.body.classList.toggle('has-selection', selectedId !== null);
  if (selectedId === null) {
    actionBar.classList.remove('show');
    return;
  }
  actionBar.classList.add('show');
  const isRoot = selectedId === ROOT_ID;
  document.getElementById('act-sibling').style.visibility = isRoot ? 'hidden' : 'visible';
  document.getElementById('act-delete').style.visibility = isRoot ? 'hidden' : 'visible';
}

// ========================================================
//  EDITING
// ========================================================
let editBackup = '';

function startEdit(id) {
  const node = byId()[id];
  if (!node) return;
  const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
  if (!el) return;
  const span = el.querySelector('.node-text');
  editingId = id;
  editBackup = node.text;
  span.setAttribute('contenteditable', 'true');
  span.focus();
  document.execCommand('selectAll', false, null);
}

function commitEdit(id) {
  if (editingId !== id) return;
  const node = byId()[id];
  const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
  if (!node || !el) { editingId = null; return; }
  const span = el.querySelector('.node-text');
  const text = span.textContent.trim();
  node.text = text || editBackup || 'ノード';
  span.textContent = node.text;
  span.setAttribute('contenteditable', 'false');
  editingId = null;
  save();
}

function cancelEdit(id) {
  const node = byId()[id];
  const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
  if (!node || !el) return;
  const span = el.querySelector('.node-text');
  span.textContent = editBackup;
  editingId = null;
}

// ========================================================
//  SELECTION
// ========================================================
function selectNode(id) {
  selectedId = id;
  nodesLayer.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.id) === id);
  });
  updateActionBar();
  hidePalette();
}

function deselect() {
  selectedId = null;
  nodesLayer.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
  updateActionBar();
  hidePalette();
}

// ========================================================
//  NODE DRAG
// ========================================================
let dragState = null; // {id, startScreenX, startScreenY, startX, startY, moved}

function onNodePointerDown(e) {
  const el = e.currentTarget;
  const id = Number(el.dataset.id);
  if (editingId === id) return; // let text editing handle its own events
  if (e.target.closest('.toggle-btn')) return;
  e.stopPropagation();
  if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;

  el.setPointerCapture(e.pointerId);
  const node = byId()[id];
  dragState = {
    id, pointerId: e.pointerId,
    startScreenX: e.clientX, startScreenY: e.clientY,
    startX: node.x, startY: node.y,
    moved: false, el
  };
  el.addEventListener('pointermove', onNodePointerMove);
  el.addEventListener('pointerup', onNodePointerUp);
  el.addEventListener('pointercancel', onNodePointerUp);
}

function onNodePointerMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const dx = (e.clientX - dragState.startScreenX) / zoom;
  const dy = (e.clientY - dragState.startScreenY) / zoom;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragState.moved = true;
  if (!dragState.moved) return;

  const node = byId()[dragState.id];
  node.x = dragState.startX + dx;
  node.y = dragState.startY + dy;
  dragState.el.classList.add('dragging');
  positionNodeEl(dragState.el, node);
  renderLines();
}

function onNodePointerUp(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const { id, moved, el } = dragState;
  el.removeEventListener('pointermove', onNodePointerMove);
  el.removeEventListener('pointerup', onNodePointerUp);
  el.removeEventListener('pointercancel', onNodePointerUp);
  el.classList.remove('dragging');
  try { el.releasePointerCapture(dragState.pointerId); } catch (err) {}
  dragState = null;

  if (!moved) {
    if (selectedId === id) {
      // second tap on already-selected node: treat as intent to edit
      if (Date.now() - (lastTapInfo.id === id ? lastTapInfo.t : 0) < 350) {
        startEdit(id);
      }
      lastTapInfo = { id, t: Date.now() };
    } else {
      selectNode(id);
      lastTapInfo = { id, t: Date.now() };
    }
  } else {
    save();
  }
}
let lastTapInfo = { id: null, t: 0 };

// double-click for desktop convenience
nodesLayer.addEventListener('dblclick', (e) => {
  const el = e.target.closest('.node');
  if (!el) return;
  const id = Number(el.dataset.id);
  selectNode(id);
  startEdit(id);
});

// ========================================================
//  CANVAS PAN + ZOOM
// ========================================================
const canvasWrap = document.getElementById('canvas-wrap');
const activePointers = new Map();
let panMode = null;   // {startPanX, startPanY, startClientX, startClientY}
let pinchMode = null; // {startDist, startZoom, startPanX, startPanY, cx, cy}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

canvasWrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.node')) return;
  canvasWrap.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 1) {
    panMode = { startPanX: pan.x, startPanY: pan.y, startClientX: e.clientX, startClientY: e.clientY, moved: false };
    pinchMode = null;
  } else if (activePointers.size === 2) {
    const pts = [...activePointers.values()];
    pinchMode = {
      startDist: dist(pts[0], pts[1]),
      startZoom: zoom,
      startPanX: pan.x, startPanY: pan.y,
      cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2
    };
    panMode = null;
  }
});

canvasWrap.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pinchMode && activePointers.size === 2) {
    const pts = [...activePointers.values()];
    const newDist = dist(pts[0], pts[1]);
    const factor = newDist / (pinchMode.startDist || 1);
    const newZoom = clampZoom(pinchMode.startZoom * factor);
    const cx = pinchMode.cx, cy = pinchMode.cy;
    const worldX = (cx - pinchMode.startPanX) / pinchMode.startZoom;
    const worldY = (cy - pinchMode.startPanY) / pinchMode.startZoom;
    zoom = newZoom;
    pan.x = cx - worldX * zoom;
    pan.y = cy - worldY * zoom;
    applyWorldTransform();
  } else if (panMode && activePointers.size === 1) {
    const dx = e.clientX - panMode.startClientX;
    const dy = e.clientY - panMode.startClientY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panMode.moved = true;
    pan.x = panMode.startPanX + dx;
    pan.y = panMode.startPanY + dy;
    applyWorldTransform();
  }
});

function endPointer(e) {
  const wasPanning = panMode && !panMode.moved && activePointers.size === 1;
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) {
    if (wasPanning) deselect();
    panMode = null;
    pinchMode = null;
    save();
  } else if (activePointers.size === 1) {
    const [pt] = [...activePointers.values()];
    panMode = { startPanX: pan.x, startPanY: pan.y, startClientX: pt.x, startClientY: pt.y, moved: true };
    pinchMode = null;
  }
}
canvasWrap.addEventListener('pointerup', endPointer);
canvasWrap.addEventListener('pointercancel', endPointer);

function clampZoom(z) { return Math.min(2.5, Math.max(0.15, z)); }

canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0012);
  const newZoom = clampZoom(zoom * factor);
  const rect = canvasWrap.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const worldX = (cx - pan.x) / zoom;
  const worldY = (cy - pan.y) / zoom;
  zoom = newZoom;
  pan.x = cx - worldX * zoom;
  pan.y = cy - worldY * zoom;
  applyWorldTransform();
  save();
}, { passive: false });

function zoomBy(factor) {
  const rect = canvasWrap.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const worldX = (cx - pan.x) / zoom;
  const worldY = (cy - pan.y) / zoom;
  zoom = clampZoom(zoom * factor);
  pan.x = cx - worldX * zoom;
  pan.y = cy - worldY * zoom;
  applyWorldTransform();
  save();
}

function fitView() {
  const map = byId();
  const visibleNodes = nodes.filter(n => isVisible(n, map));
  if (visibleNodes.length === 0) return;
  const pad = 110;
  const minX = Math.min(...visibleNodes.map(n => n.x)) - pad;
  const maxX = Math.max(...visibleNodes.map(n => n.x)) + pad;
  const minY = Math.min(...visibleNodes.map(n => n.y)) - pad;
  const maxY = Math.max(...visibleNodes.map(n => n.y)) + pad;
  const rect = canvasWrap.getBoundingClientRect();
  const w = Math.max(1, maxX - minX);
  const h = Math.max(1, maxY - minY);
  const newZoom = clampZoom(Math.min(rect.width / w, rect.height / h, 1.5));
  zoom = newZoom;
  pan.x = rect.width / 2 - ((minX + maxX) / 2) * zoom;
  pan.y = rect.height / 2 - ((minY + maxY) / 2) * zoom;
  applyWorldTransform();
  save();
}

// ========================================================
//  ACTION BAR / TOOLBAR HANDLERS
// ========================================================
document.getElementById('btn-add-root').addEventListener('click', () => {
  const parentId = selectedId !== null ? selectedId : ROOT_ID;
  const id = addChildNode(parentId);
  save();
  render();
  selectNode(id);
});

document.getElementById('btn-fit').addEventListener('click', fitView);
document.getElementById('btn-zoom-in').addEventListener('click', () => zoomBy(1.25));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(0.8));

document.getElementById('btn-new').addEventListener('click', () => {
  if (!confirm('新しいマップを作成しますか？現在の内容は失われます。')) return;
  resetMap();
  save();
  render();
  fitView();
});

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ nodes, nextId }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'brainmap.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

const importInput = document.getElementById('import-input');
document.getElementById('btn-import').addEventListener('click', () => importInput.click());
importInput.addEventListener('change', () => {
  const file = importInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.nodes) || !data.nodes.some(n => n.id === ROOT_ID)) {
        throw new Error('invalid');
      }
      nodes = data.nodes;
      nextId = data.nextId || (Math.max(...nodes.map(n => n.id)) + 1);
      selectedId = null;
      editingId = null;
      save();
      render();
      fitView();
    } catch (e) {
      alert('読み込みに失敗しました。ファイル形式を確認してください。');
    }
    importInput.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('act-edit').addEventListener('click', () => {
  if (selectedId !== null) startEdit(selectedId);
});
document.getElementById('act-child').addEventListener('click', () => {
  if (selectedId === null) return;
  const id = addChildNode(selectedId);
  save();
  render();
  selectNode(id);
});
document.getElementById('act-sibling').addEventListener('click', () => {
  if (selectedId === null || selectedId === ROOT_ID) return;
  const id = addSiblingNode(selectedId);
  save();
  render();
  selectNode(id);
});
document.getElementById('act-delete').addEventListener('click', () => {
  if (selectedId === null || selectedId === ROOT_ID) return;
  deleteNode(selectedId);
  save();
  render();
  if (selectedId !== null) selectNode(selectedId); else updateActionBar();
});

document.getElementById('act-color').addEventListener('click', (e) => {
  if (selectedId === null) return;
  openPalette(e.currentTarget);
});

function openPalette(anchor) {
  palettePop.innerHTML = '';
  PALETTE.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.addEventListener('click', () => applyColor(selectedId, c));
    palettePop.appendChild(sw);
  });
  const rect = anchor.getBoundingClientRect();
  palettePop.style.left = Math.min(rect.left, window.innerWidth - 190) + 'px';
  palettePop.style.top = (rect.top - 150) + 'px';
  palettePop.classList.add('show');
}
function hidePalette() { palettePop.classList.remove('show'); }
document.addEventListener('click', (e) => {
  if (!palettePop.contains(e.target) && e.target.id !== 'act-color') hidePalette();
});

function applyColor(id, color) {
  const node = byId()[id];
  if (!node) return;
  const oldColor = node.color;
  const targets = [id, ...descendants(id)];
  const map = byId();
  targets.forEach(tid => {
    const n = map[tid];
    if (n.parentId === id || tid === id || n.color === oldColor) n.color = color;
  });
  hidePalette();
  save();
  render();
}

// ========================================================
//  KEYBOARD SHORTCUTS
// ========================================================
document.addEventListener('keydown', (e) => {
  if (editingId !== null) return;
  if (selectedId === null) return;
  if (e.key === 'Tab') {
    e.preventDefault();
    const id = addChildNode(selectedId);
    save(); render(); selectNode(id);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const id = selectedId === ROOT_ID ? addChildNode(ROOT_ID) : addSiblingNode(selectedId);
    save(); render(); selectNode(id);
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId === ROOT_ID) return;
    e.preventDefault();
    deleteNode(selectedId);
    save(); render();
    if (selectedId !== null) selectNode(selectedId); else updateActionBar();
  } else if (e.key === 'F2') {
    e.preventDefault();
    startEdit(selectedId);
  } else if (e.key === 'Escape') {
    deselect();
  }
});

// ========================================================
//  INIT
// ========================================================
load();
render();
applyWorldTransform();
window.addEventListener('resize', () => applyWorldTransform());
requestAnimationFrame(fitView);

})();
</script>
</body>
</html>
