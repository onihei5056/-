name: 不動産現地調査PWAを公開(GitHub Pages)

# mainブランチに変更があるたびに、自動でビルドしてGitHub Pagesへ公開する。
# 手動で実行したい場合はGitHubの Actions タブから「Run workflow」を押す。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする(後から来た方を優先)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 依存パッケージをインストール
        working-directory: app
        run: npm ci

      - name: ビルド
        working-directory: app
        run: npm run build

      - name: 公開用フォルダを準備
        run: |
          # 調査アプリをサイトの入口(ルート)に配置する
          cp -r app/dist ./_site
          # 既存のクアルトゲームは /quarto/ に残す
          mkdir -p ./_site/quarto
          cp index.html ./_site/quarto/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
